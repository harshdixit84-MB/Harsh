name: Delivery value scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 15 * * *"

jobs:
  delivery-value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance gspread google-auth

      - name: Run delivery value scan
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python delivery_value.py

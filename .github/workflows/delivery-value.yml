name: Delivery Value tracking

on:
  schedule:
    # Once daily at 8:00 PM IST = 14:30 UTC, Mon-Fri (after bhavcopy publishes)
   # - cron: "30 14 * * 1-5"
  workflow_dispatch: {}

jobs:
  delivery-value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Run delivery value tracking
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python delivery_value.py

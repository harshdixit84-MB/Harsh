<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P/L Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Backgrounds */
  --bg:#ffffff;
  --surface-1:#ffffff;
  --surface-2:#f8fafc;

  /* Borders */
  --border: #cbd5e1;

  /* Text */
  --text-primary:#111827;
  --text-secondary:#475569;

  /* Status Colors */
  --accent-buy: #166534;
  --accent-buy-dim: rgba(22,101,52,.10);

  --accent-watch: #a16207;
  --accent-watch-dim: rgba(161,98,7,.10);

  --accent-tracking: #1d4ed8;
  --accent-tracking-dim: rgba(29,78,216,.10);

  --accent-needtarget: #0f766e;

  --accent-loss: #991b1b;

  --accent-magenta: #be185d;

  --accent-open: #0f766e;
  --accent-closed: #64748b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: "IBM Plex Mono", monospace;
  min-height: 100vh;
}

.wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid #94a3b8;
}

.title { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 26px; color: #0f172a; }
.back-link {
  color: var(--text-secondary);
  font-size: 12px;
  text-decoration: none;
  background: #ffffff;
  border: 2px solid #94a3b8;
  padding: 6px 12px;
  border-radius: 6px;
}
.back-link:hover { color: var(--text-primary); border-color: #111827; }

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stat-box {
  background: var(--surface-1);
  border: 2px solid #334155;
  border-radius: 8px;
  padding: 14px;
  box-shadow: 0 3px 10px rgba(15,23,42,.06);
}
.stat-box .label { font-family: "Space Grotesk", sans-serif; color: var(--text-primary); font-size: 15px; font-weight: 600; letter-spacing: 0.01em; margin-bottom: 6px; }
.stat-box .num { font-family: "IBM Plex Mono", monospace; color: var(--text-secondary); font-size: 13px; font-weight: 500; }

/* ===== Collapsible sections (matches dashboard) ===== */
.dash-section { margin: 0 0 18px 0; }
.dash-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  background: #eef3f8;
  border: 2px solid #334155;
  border-radius: 9px 9px 0 0;
  color: #0f172a;
  font-family: "Space Grotesk", sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .02em;
}
.dash-section-body {
  border-left: 2px solid #334155;
  border-right: 2px solid #334155;
  border-bottom: 2px solid #334155;
  border-radius: 0 0 9px 9px;
  padding: 14px;
  background: #ffffff;
}
.dash-section.minimized .dash-section-head { border-radius: 9px; border-bottom: 2px solid #334155; }
.dash-section.minimized .dash-section-body { display: none; }
.dash-min-btn {
  flex: 0 0 auto;
  width: 32px;
  height: 30px;
  border: 2px solid #0f172a;
  border-radius: 6px;
  background: #ffffff;
  color: #0f172a;
  font-size: 20px;
  font-weight: 900;
  line-height: 24px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.dash-min-btn:hover { background: #dbeafe; border-color: #1d4ed8; color: #1d4ed8; }
.dash-min-btn .dash-icon { display: block; transform: translateY(-1px); }

.add-form {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

input[type="text"], input[type="number"] {
  background: #ffffff;
  border: 2px solid #94a3b8;
  color: var(--text-primary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  padding: 7px 10px;
  border-radius: 5px;
}
input[type="text"] { width: 100px; text-transform: uppercase; }
input[type="number"] { width: 90px; }
input:focus { outline: none; border-color: var(--accent-tracking); }

button.action-btn {
  background: var(--accent-buy);
  border: none;
  color: #ffffff;
  font-family: "IBM Plex Mono", monospace;
  font-weight: 700;
  font-size: 12px;
  padding: 8px 16px;
  border-radius: 5px;
  cursor: pointer;
}
button.action-btn:hover { opacity: 0.85; }
button.action-btn.saving { opacity: 0.5; pointer-events: none; }

.rows { display: flex; flex-direction: column; gap: 6px; }

.row {
  display: grid;
  grid-template-columns: 90px 70px 90px 120px 140px auto;
  align-items: center;
  gap: 12px;
  background: var(--surface-1);
  border: 2px solid #334155;
  border-left: 6px solid #334155;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 12px;
  box-shadow: 0 3px 10px rgba(15,23,42,.06);
}
.row.open-row { border-left-color: var(--accent-open); }
.row.closed-row { border-left-color: var(--accent-closed); }

.row .symbol { font-weight: 600; font-size: 13px; }
.row .label { color: var(--text-secondary); font-size: 10px; text-transform: uppercase; margin-bottom: 2px; }

.tv-link {
  font-size: 10px;
  color: var(--text-secondary);
  text-decoration: none;
  background: #ffffff;
  border: 2px solid #94a3b8;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 6px;
  vertical-align: middle;
}
.tv-link:hover { color: var(--accent-tracking); border-color: var(--accent-tracking); }

/* Hardened & bold gain/loss pills, matching the dashboard's confirmed-buy/sell badges */
.pl-amount { font-weight: 800; font-size: 12px; padding: 3px 9px; border-radius: 6px; display: inline-block; }
.pl-amount.gain { background: #166534; color: #ffffff; border: 2px solid #0f4c26; }
.pl-amount.loss { background: #991b1b; color: #ffffff; border: 2px solid #6b1414; }

.sell-form { display: flex; gap: 6px; justify-content: flex-end; }
.sell-form input { width: 80px; }

.empty { color: var(--text-secondary); text-align: center; padding: 30px 0; font-size: 13px; }

.high-dv-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent-needtarget);
  background: rgba(15,118,110,0.08);
  border: 2px solid var(--accent-needtarget);
  padding: 2px 7px;
  border-radius: 4px;
  display: inline-block;
  margin-top: 4px;
}
.verdict-tag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-block;
  font-weight: 800;
  margin-top: 4px;
  margin-left: 4px;
}
.verdict-tag.buying { background: #166534; color: #ffffff; border: 2px solid #0f4c26; }
.verdict-tag.selling { background: #991b1b; color: #ffffff; border: 2px solid #6b1414; }

@media (max-width: 700px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .row { grid-template-columns: 1fr; gap: 6px; }
  .sell-form { justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="title">P/L Tracker</div>
<a href="/" class="back-link">← Back to dashboard</a>
</header>

<div class="stats">
<div class="stat-box">
<div class="label">Realized P/L</div>
<div class="num" id="stat-realized">–</div>
</div>
<div class="stat-box">
<div class="label">Unrealized P/L</div>
<div class="num" id="stat-unrealized">–</div>
</div>
<div class="stat-box">
<div class="label">Open positions</div>
<div class="num" id="stat-open">–</div>
</div>
<div class="stat-box">
<div class="label">Closed trades</div>
<div class="num" id="stat-closed">–</div>
</div>
</div>

<div class="dash-section" id="dash-section-add-buy">
<div class="dash-section-head">
<span>RECORD A NEW BUY</span>
<button class="dash-min-btn" type="button" title="Minimize"><span class="dash-icon">−</span></button>
</div>
<div class="dash-section-body">
<div class="add-form">
<input type="text" id="buy-symbol" placeholder="SYMBOL" />
<input type="number" step="0.01" id="buy-price" placeholder="Buy price" />
<input type="number" step="1" id="buy-qty" placeholder="Qty" style="width: 70px;" />
<button class="action-btn" id="add-buy-btn">Add position</button>
</div>
</div>
</div>

<div class="dash-section" id="dash-section-open-positions">
<div class="dash-section-head">
<span>OPEN POSITIONS</span>
<button class="dash-min-btn" type="button" title="Minimize"><span class="dash-icon">−</span></button>
</div>
<div class="dash-section-body">
<div class="rows" id="open-rows">
<div class="empty">Loading…</div>
</div>
</div>
</div>

<div class="dash-section" id="dash-section-closed-trades">
<div class="dash-section-head">
<span>CLOSED TRADES</span>
<button class="dash-min-btn" type="button" title="Minimize"><span class="dash-icon">−</span></button>
</div>
<div class="dash-section-body">
<div class="rows" id="closed-rows">
<div class="empty">Loading…</div>
</div>
</div>
</div>

</div>

<script>
async function loadTrades() {
  try {
    const res = await fetch("/api/trades?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();

    if (data.error) {
      document.getElementById("open-rows").innerHTML = `<div class="empty">Error: ${data.error}</div>`;
      return;
    }

    document.getElementById("stat-realized").textContent = "₹" + data.summary.realized;
    document.getElementById("stat-unrealized").textContent = "₹" + data.summary.unrealized;
    document.getElementById("stat-open").textContent = data.summary.openCount;
    document.getElementById("stat-closed").textContent = data.summary.closedCount;

    renderOpen(data.open);
    renderClosed(data.closed);
  } catch (e) {
    document.getElementById("open-rows").innerHTML = `<div class="empty">Could not reach the trades API.</div>`;
  }
}

function renderOpen(trades) {
  const container = document.getElementById("open-rows");
  if (trades.length === 0) {
    container.innerHTML = '<div class="empty">No open positions yet.</div>';
    return;
  }

  container.innerHTML = trades.map((t) => {
    const hasPrice = t.current_price !== null && t.current_price !== undefined;
    const plCls = hasPrice ? (t.pl_amount >= 0 ? "gain" : "loss") : "";
    const plText = hasPrice ? `₹${t.pl_amount} (${t.pl_percent >= 0 ? "+" : ""}${t.pl_percent}%)` : "price unavailable";

    return `
      <div class="row open-row">
        <div>
          <div class="label">Symbol</div>
          <div class="symbol">${t.symbol}<a href="https://www.tradingview.com/chart/?symbol=NSE:${t.symbol}" target="_blank" rel="noopener" class="tv-link">TV ↗</a></div>
          ${t.high_dv ? `<span class="high-dv-tag">⬤ High DV</span>` : ""}
          ${t.buying_selling_verdict === "Heavy Buying" ? `<span class="verdict-tag buying">Heavy Buying</span>` : ""}
          ${t.buying_selling_verdict === "Heavy Selling" ? `<span class="verdict-tag selling">Heavy Selling</span>` : ""}
        </div>
        <div><div class="label">Qty</div>${t.quantity}</div>
        <div><div class="label">Buy</div>₹${t.buy_price}</div>
        <div><div class="label">Current</div>${hasPrice ? "₹" + t.current_price : "—"}</div>
        <div><div class="label">Unrealized P/L</div><span class="pl-amount ${plCls}">${plText}</span></div>
        <div class="sell-form">
          <input type="number" step="0.01" class="sell-price-input" data-symbol="${t.symbol}" placeholder="Sell @" />
          <button class="action-btn sell-btn" data-symbol="${t.symbol}">Sell</button>
        </div>
      </div>
    `;
  }).join("");
}

function renderClosed(trades) {
  const container = document.getElementById("closed-rows");
  if (trades.length === 0) {
    container.innerHTML = '<div class="empty">No closed trades yet.</div>';
    return;
  }

  container.innerHTML = trades.map((t) => {
    const plCls = t.pl_amount >= 0 ? "gain" : "loss";
    return `
      <div class="row closed-row">
        <div>
          <div class="label">Symbol</div>
          <div class="symbol">${t.symbol}<a href="https://www.tradingview.com/chart/?symbol=NSE:${t.symbol}" target="_blank" rel="noopener" class="tv-link">TV ↗</a></div>
          ${t.high_dv ? `<span class="high-dv-tag">⬤ High DV</span>` : ""}
          ${t.buying_selling_verdict === "Heavy Buying" ? `<span class="verdict-tag buying">Heavy Buying</span>` : ""}
          ${t.buying_selling_verdict === "Heavy Selling" ? `<span class="verdict-tag selling">Heavy Selling</span>` : ""}
        </div>
        <div><div class="label">Qty</div>${t.quantity}</div>
        <div><div class="label">Buy</div>₹${t.buy_price}</div>
        <div><div class="label">Sell</div>₹${t.sell_price}</div>
        <div><div class="label">Realized P/L</div><span class="pl-amount ${plCls}">₹${t.pl_amount} (${t.pl_percent >= 0 ? "+" : ""}${t.pl_percent}%)</span></div>
        <div style="color:var(--text-secondary); font-size:11px;">${t.buy_date} → ${t.sell_date}</div>
      </div>
    `;
  }).join("");
}

document.getElementById("add-buy-btn").addEventListener("click", async () => {
  const symbol = document.getElementById("buy-symbol").value.trim();
  const price = parseFloat(document.getElementById("buy-price").value);
  const quantity = parseFloat(document.getElementById("buy-qty").value) || 1;
  const btn = document.getElementById("add-buy-btn");

  if (!symbol || !price || price <= 0) {
    alert("Enter a valid symbol and buy price.");
    return;
  }

  btn.classList.add("saving");
  try {
    const res = await fetch("/api/add-trade", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "buy", symbol, price, quantity }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "Failed to add");

    document.getElementById("buy-symbol").value = "";
    document.getElementById("buy-price").value = "";
    document.getElementById("buy-qty").value = "";
    await loadTrades();
  } catch (err) {
    alert("Could not add position: " + err.message);
  } finally {
    btn.classList.remove("saving");
  }
});

document.getElementById("open-rows").addEventListener("click", async (e) => {
  if (!e.target.classList.contains("sell-btn")) return;

  const btn = e.target;
  const symbol = btn.dataset.symbol;
  const input = document.querySelector(`.sell-price-input[data-symbol="${symbol}"]`);
  const price = parseFloat(input.value);

  if (!price || price <= 0) {
    input.style.borderColor = "var(--accent-loss)";
    return;
  }

  btn.classList.add("saving");
  try {
    const res = await fetch("/api/add-trade", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "sell", symbol, price }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "Failed to sell");

    await loadTrades();
  } catch (err) {
    alert("Could not close position: " + err.message);
    btn.classList.remove("saving");
  }
});

loadTrades();
setInterval(loadTrades, 5 * 60 * 1000);

/* ===== Collapsible sections: minimize/restore, persisted per-section ===== */
(function () {
  document.querySelectorAll(".dash-section").forEach((section) => {
    const btn = section.querySelector(".dash-min-btn");
    const icon = btn.querySelector(".dash-icon");
    const key = "pl-min-" + section.id;

    function setState(minimized) {
      section.classList.toggle("minimized", minimized);
      icon.textContent = minimized ? "+" : "−";
      btn.title = (minimized ? "Restore" : "Minimize");
      try { localStorage.setItem(key, minimized ? "1" : "0"); } catch (e) {}
    }

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      setState(!section.classList.contains("minimized"));
    });

    try {
      if (localStorage.getItem(key) === "1") setState(true);
    } catch (e) {}
  });
})();
</script>
</body>
</html>

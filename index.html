<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monthly Breakout Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Backgrounds */
  --bg:#081321;
  --surface-1:#13233a;
  --surface-2:#1a2f4d;

  /* Borders */
  --border: #263952;

  /* Text */
  --text-primary:#ffffff;
  --text-secondary:#9ba8b8;

  /* Status Colors */
  --accent-buy: #198754;
  --accent-buy-dim: rgba(25, 135, 84, 0.12);

  --accent-watch: #b8860b;
  --accent-watch-dim: rgba(184, 134, 11, 0.12);

  --accent-tracking: #0d6efd;
  --accent-tracking-dim: rgba(13, 110, 253, 0.12);

  --accent-needtarget: #0a8cb3;

  --accent-loss: #c0392b;

  --accent-magenta: #ff00ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: "IBM Plex Mono", monospace;
  min-height: 100vh;
}

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 32px 20px 60px;
}

.dashboard-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:24px;
  padding-bottom:24px;
  gap:25px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}

.header-left{
  display:flex;
  flex-direction:column;
}

.dashboard-title{
  font-size:34px;
  font-weight:700;
  color:#ffffff;
  font-family:"Space Grotesk",sans-serif;
}

.dashboard-subtitle{
  margin-top:6px;
  color:#9ca3af;
  font-size:13px;
}

.header-links{
  margin-top:18px;
}

.header-btn{
  text-decoration:none;
  background:#18263d;
  color:white;
  padding:10px 18px;
  border-radius:10px;
  border:1px solid #2f4568;
  transition:.25s;
  display:inline-block;
}

.header-btn:hover{
  background:#223557;
}

.header-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:18px;
}

.live-box{
  background:#11273d;
  border:1px solid #2e4a6d;
  color:#6eff8d;
  padding:8px 16px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}

.live-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#2bff63;
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  0%{ opacity:1; transform:scale(1); }
  50%{ opacity:.35; transform:scale(.8); }
  100%{ opacity:1; transform:scale(1); }
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,130px);
  gap:14px;
}

.stat-card{
  background:#13233a;
  padding:16px;
  border-radius:12px;
  border:1px solid #263952;
  text-align:center;
  transition:.3s;
}

.stat-card:hover{
  transform:translateY(-3px);
}

.stat-value{
  font-size:30px;
  font-weight:700;
  color:white;
}

.stat-label{
  margin-top:5px;
  font-size:12px;
  color:#97a6bb;
  text-transform:uppercase;
  letter-spacing:1px;
}

.green{ border-left:4px solid #2dd36f; }
.yellow{ border-left:4px solid #ffc107; }
.blue{ border-left:4px solid #00b8ff; }

.toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 16px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

#stock-search {
  width: 100%;
  max-width: 320px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 13px;
  padding: 9px 12px;
  border-radius: 8px;
}
#stock-search:focus { outline: none; border-color: var(--accent-tracking); }

.quick-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 12px;
  border-top: 3px solid var(--accent-buy);
}

.chip-check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
}
.chip-check input { accent-color: var(--accent-tracking); cursor: pointer; }
.chip-check.on { border-color: var(--text-primary); color: var(--text-primary); }

.reset-btn {
  background: var(--surface-1);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  margin-left: auto;
}
.reset-btn:hover { color: var(--text-primary); border-color: var(--text-primary); }

.dropdown-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 12px;
  border-top: 3px solid var(--accent-buy);
}

.dd-select {
  background: var(--surface-1);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
}
.dd-select:focus { outline: none; border-color: var(--text-primary); }

.ticker-band {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 10px;
  padding-bottom: 16px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.ticker-label {
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.ticker-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.ticker-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 6px;
  border: 1px solid;
  white-space: nowrap;
}
.ticker-chip.up { color: #3ddc8a; border-color: rgba(61,220,138,0.5); background: rgba(61,220,138,0.1); }
.ticker-chip.down { color: #e5626b; border-color: rgba(229,98,107,0.5); background: rgba(229,98,107,0.1); }

.ticker-empty { font-size: 11px; color: var(--text-secondary); }

/* NEWS PANEL */
.news-panel {
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent-buy);
  border-radius: 10px;
  background: var(--surface-1);
  margin-bottom: 16px;
  overflow: hidden;
}

.news-panel-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.news-panel-header {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-secondary);
  white-space: nowrap;
}

.news-filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.news-search-input {
  flex: 1;
  min-width: 120px;
  max-width: 200px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  padding: 5px 9px;
  border-radius: 6px;
}
.news-search-input:focus { outline: none; border-color: var(--accent-tracking); }

.news-filter-chip {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.news-filter-chip:hover { color: var(--text-primary); border-color: var(--text-primary); }
.news-filter-chip.on { color: var(--text-primary); border-color: var(--text-primary); }
.news-filter-chip.on[data-filter="Good"] { background: rgba(25,135,84,0.18); color: #3ddc8a; border-color: rgba(61,220,138,0.5); }
.news-filter-chip.on[data-filter="Bad"] { background: rgba(192,57,43,0.18); color: #e5626b; border-color: rgba(229,98,107,0.5); }
.news-filter-chip.on[data-filter="Neutral"] { background: var(--surface-2); color: var(--text-primary); border-color: var(--text-primary); }

.news-list {
  max-height: 360px;
  overflow-y: auto;
}

.news-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.news-item:last-child { border-bottom: none; }
.news-item:hover { background: var(--surface-2); }

.news-flag {
  flex-shrink: 0;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 5px;
  white-space: nowrap;
  margin-top: 2px;
}
.news-flag.good { background: rgba(25,135,84,0.18); color: #3ddc8a; }
.news-flag.bad { background: rgba(192,57,43,0.18); color: #e5626b; }
.news-flag.neutral { background: var(--surface-2); color: var(--text-secondary); }

.news-body { flex: 1; min-width: 0; }

.news-top-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.news-symbol { font-weight: 600; font-size: 12px; color: var(--text-primary); }

.news-date { font-size: 10px; color: var(--text-secondary); }

.news-headline {
  font-size: 12px;
  color: var(--text-primary);
  margin-top: 3px;
  line-height: 1.4;
}
.news-headline a { color: inherit; text-decoration: none; }
.news-headline a:hover { color: var(--accent-tracking); }

.news-reason { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

.news-dismiss {
  flex-shrink: 0;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 24px;
  height: 24px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  margin-top: 2px;
}
.news-dismiss:hover { color: var(--accent-loss); border-color: var(--accent-loss); }

.news-empty { padding: 16px; font-size: 12px; color: var(--text-secondary); text-align: center; }

.table-scroll {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-1);
}

table.stock-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 680px;
}

.stock-table thead th {
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.stock-table thead th.sortable { cursor: pointer; }
.stock-table thead th.sortable:hover { color: var(--text-primary); }

.stock-row td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  vertical-align: middle;
}
.stock-row:last-child td { border-bottom: none; }
.stock-row:hover { background: var(--surface-2); }

.stock-row.buyzone { box-shadow: inset 3px 0 0 var(--accent-buy); }
.stock-row.watch { box-shadow: inset 3px 0 0 var(--accent-watch); }
.stock-row.tracking { box-shadow: inset 3px 0 0 transparent; }
.stock-row.needtarget { box-shadow: inset 3px 0 0 var(--accent-needtarget); }
.stock-row.archived { opacity: 0.6; box-shadow: inset 3px 0 0 var(--text-secondary); }

.cell-symbol { min-width: 190px; }

.symbol-line {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.symbol {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.01em;
}

.name {
  color: var(--text-secondary);
  font-size: 9px;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 190px;
}

.tv-link {
  font-size: 9px;
  color: var(--text-secondary);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 1px 5px;
  border-radius: 4px;
  vertical-align: middle;
}
.tv-link:hover { color: var(--accent-tracking); border-color: var(--accent-tracking); }

.mini-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.mini-tag.squeeze { color: #f28ab4; border-color: rgba(242,138,180,0.4); }
.mini-tag.adp-rising { color: #3ddc8a; border-color: rgba(61,220,138,0.4); }
.mini-tag.adp-falling { color: #e5626b; border-color: rgba(229,98,107,0.4); }
.mini-tag.dv-buying { color: #3ddc8a; border-color: rgba(61,220,138,0.4); }
.mini-tag.dv-selling { color: #e5626b; border-color: rgba(229,98,107,0.4); }
.mini-tag.cross-bull { color: #3ddc8a; border-color: rgba(61,220,138,0.4); font-weight: 700; }
.mini-tag.cross-bear { color: #e5626b; border-color: rgba(229,98,107,0.4); font-weight: 700; }

.notes-toggle {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  background: transparent;
  cursor: pointer;
  vertical-align: middle;
}
.notes-toggle:hover { color: var(--text-primary); border-color: var(--text-primary); }
.notes-toggle.has-notes { color: #ffcf3d; border-color: rgba(255,207,61,0.4); }

.notes-row td { background: var(--surface-2); padding: 12px 14px; }
.notes-panel { display: flex; flex-direction: column; gap: 10px; }
.notes-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
.note-entry {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-size: 12px;
  padding: 6px 8px;
  border-radius: 6px;
  background: var(--surface-1);
  border: 1px solid var(--border);
}
.note-date { flex-shrink: 0; color: var(--text-secondary); font-size: 10px; white-space: nowrap; }
.note-text { color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
.note-empty { font-size: 12px; color: var(--text-secondary); padding: 4px 0; }
.notes-add { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.notes-input {
  flex: 1;
  min-width: 200px;
  min-height: 54px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 8px;
  resize: vertical;
}
.notes-input:focus { outline: none; border-color: var(--accent-tracking); }
.notes-save-btn {
  background: var(--accent-buy);
  border: none;
  color: white;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
}
.notes-save-btn:hover { opacity: 0.9; }
.notes-save-btn.saving { opacity: 0.5; pointer-events: none; }
.mini-tag.harmonic-bull { color: #3ddc8a; border-color: rgba(61,220,138,0.4); }
.mini-tag.harmonic-bear { color: #e5626b; border-color: rgba(229,98,107,0.4); }
.mini-tag.wm { color: #ffcf3d; border-color: rgba(255,207,61,0.4); }
.mini-tag.rsi-bull { color: #3ddc8a; border-color: rgba(61,220,138,0.4); }
.mini-tag.rsi-bear { color: #e5626b; border-color: rgba(229,98,107,0.4); }
.mini-tag.archived { color: var(--text-secondary); border-color: var(--text-secondary); }
.mini-tag.jackpot { color: #1a1206; background: #ffd60a; border-color: #ffd60a; font-weight: 700; }

.tag-row {
  display: flex;
  gap: 3px;
  margin-top: 3px;
  flex-wrap: wrap;
}

.bs-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 5px;
  white-space: nowrap;
}
.bs-pill.buy { background: rgba(25,135,84,0.18); color: #3ddc8a; }
.bs-pill.sell { background: rgba(192,57,43,0.18); color: #e5626b; }

.decision-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 6px;
  white-space: nowrap;
}
.decision-badge.confirmed-buy { background: #198754; color: #ffffff; }
.decision-badge.confirmed-sell { background: #c0392b; color: #ffffff; }
.decision-badge.early-buy { background: rgba(25,135,84,0.14); color: #3ddc8a; border: 1px solid rgba(61,220,138,0.4); }
.decision-badge.early-sell { background: rgba(192,57,43,0.14); color: #e5626b; border: 1px solid rgba(229,98,107,0.4); }

.mono-cell {
  font-family: "IBM Plex Mono", monospace;
  white-space: nowrap;
}

.value-edit {
  display: flex;
  gap: 4px;
  align-items: center;
}

.value-input {
  width: 66px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  padding: 3px 5px;
  border-radius: 4px;
}
.value-input:focus { outline: none; border-color: var(--accent-buy); }
.value-input.sl-input:focus { border-color: var(--accent-loss); }

.save-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 9px;
  padding: 3px 6px;
  border-radius: 4px;
  cursor: pointer;
}
.save-btn:hover { color: var(--accent-buy); border-color: var(--accent-buy); }
.save-btn.sl-save:hover { color: var(--accent-loss); border-color: var(--accent-loss); }
.save-btn.saving { opacity: 0.5; pointer-events: none; }

.price-cell { display: flex; flex-direction: column; gap: 1px; }
.price { color: var(--text-primary); font-size: 13px; font-weight: 600; }
.day-change { font-size: 10px; }
.trend-arrow { font-size: 9px; margin-right: 2px; }

.decision-pill {
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 5px;
  white-space: nowrap;
  display: inline-block;
}
.decision-pill.confirmed { background: rgba(25,135,84,0.18); color: #3ddc8a; }
.decision-pill.watching { background: var(--surface-2); color: var(--text-secondary); }

.empty, .loading {
  color: var(--text-secondary);
  text-align: center;
  padding: 50px 0;
  font-size: 13px;
}

footer {
  color: var(--text-secondary);
  font-size: 11px;
  text-align: center;
  margin-top: 32px;
}

@media (max-width: 640px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .cell-symbol { min-width: 160px; }
}
</style>
</head>
<body>
<div class="wrap">
<header class="dashboard-header">

<div class="header-left">

<div class="dashboard-title">
Monthly Breakout Scan
</div>

<div class="dashboard-subtitle" id="synced-at">
Loading last sync...
</div>

<div class="header-links">

<a href="/pl.html" class="header-btn">
📊 P/L Tracker
</a>

</div>

</div>

<div class="header-right">

<div class="live-box">

<span class="live-dot"></span>

LIVE

</div>

<div class="stats-grid">

<div class="stat-card">

<div class="stat-value" id="stat-total">0</div>

<div class="stat-label">Tracked</div>

</div>

<div class="stat-card green">

<div class="stat-value" id="stat-buyzone">0</div>

<div class="stat-label">Buy Zone</div>

</div>

<div class="stat-card yellow">

<div class="stat-value" id="stat-neartarget">0</div>

<div class="stat-label">Near Target</div>

</div>

<div class="stat-card blue">

<div class="stat-value" id="stat-needtarget">0</div>

<div class="stat-label">Need Target</div>

</div>

</div>

</div>

</header>

<div class="toolbar">
<input type="text" id="stock-search" placeholder="Search by symbol or name…" />

<div class="quick-row">
<label class="chip-check" id="chip-neartarget"><input type="checkbox" data-quick="neartarget"><span>Near Target</span></label>
<label class="chip-check" id="chip-needtarget"><input type="checkbox" data-quick="needtarget"><span>Need Target</span></label>
<label class="chip-check" id="chip-confirmedbuy"><input type="checkbox" data-quick="confirmedBuy"><span>✔ Confirmed Buy</span></label>
<label class="chip-check" id="chip-squeeze"><input type="checkbox" data-quick="squeeze"><span>◆ Squeeze</span></label>
<label class="chip-check" id="chip-rsidbull"><input type="checkbox" data-quick="rsiDBull"><span>RSI D Bull</span></label>
<label class="chip-check" id="chip-rsidbear"><input type="checkbox" data-quick="rsiDBear"><span>RSI D Bear</span></label>

<script>
const WATCH_THRESHOLD = 2; // within this % counts as "watch"
let currentSearch = "";
let quickFilters = { neartarget: false, needtarget: false, confirmedBuy: false, squeeze: false, rsiDBull: false, rsiDBear: false, rsiWBull: false, rsiWBear: false, above20: false, below20: false, jackpot: false };
let buysellFilter = "all";
let decisionFilter = "all";
let sourceFilter = "all";
let crossAgeFilter = "all";
let cmpSortDir = null; // null | "asc" | "desc"
let latestStocks = [];
let expandedNotes = new Set();

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function classify(stock) {
  if (stock.distance_pct === undefined) return "needtarget";
  const d = Math.abs(stock.distance_pct);
  if (stock.distance_pct <= 0) return "buyzone";
  if (d <= WATCH_THRESHOLD) return "watch";
  return "tracking";
}

function buySell(stock) {
  if (stock.buying_selling_verdict === "Heavy Buying") return "buy";
  if (stock.buying_selling_verdict === "Heavy Selling") return "sell";
  if (stock.distance_pct !== undefined) return stock.distance_pct <= 0 ? "buy" : "sell";
  return "buy";
}

function decision(stock) {
  return classify(stock) === "buyzone" ? "Confirmed" : "Watching";
}

function decisionBadge(stock) {
  const map = {
    "Confirmed Buy": { cls: "confirmed-buy", label: "Confirmed Buy" },
    "Confirmed Sell": { cls: "confirmed-sell", label: "Confirmed Sell" },
    "Early Buy Signal": { cls: "early-buy", label: "Early Buy" },
    "Early Sell Signal": { cls: "early-sell", label: "Early Sell" },
  };
  const entry = map[stock.dv_decision];
  if (!entry) return "";
  const age = stock.adp_crossover_age;
  const ageStr = age !== null && age !== undefined && age !== "" ? ` · ${age}d` : "";
  const title = `Crossover held ${age ?? "?"}d · last 10d leaning ${stock.adp_recent_bias || "mixed"}`;
  return `<span class="decision-badge ${entry.cls}" title="${title}">${entry.label}${ageStr}</span>`;
}

function renderNotesRow(stock) {
  const comments = (stock.comments || []).slice().sort((a, b) => (b.created_at || b.date || "").localeCompare(a.created_at || a.date || ""));
  const list = comments.length
    ? comments.map((c) => `<div class="note-entry"><span class="note-date">${escapeHtml(c.date)}</span><span class="note-text">${escapeHtml(c.comment)}</span></div>`).join("")
    : `<div class="note-empty">No notes yet for ${stock.symbol}.</div>`;

  return `
    <tr class="notes-row" data-notes-for="${stock.symbol}">
      <td colspan="6">
        <div class="notes-panel">
          <div class="notes-list">${list}</div>
          <div class="notes-add">
            <textarea class="notes-input" placeholder="Add an observation for ${stock.symbol}…" data-symbol="${stock.symbol}"></textarea>
            <button class="notes-save-btn" data-symbol="${stock.symbol}">Save Note</button>
          </div>
        </div>
      </td>
    </tr>
  `;
}

function renderRow(stock) {
  const cls = classify(stock);
  const bs = buySell(stock);

  const dayChange = stock.percent_change || 0;
  const dayChangeColor = dayChange >= 0 ? "var(--accent-buy)" : "var(--accent-loss)";
  const trendArrow = dayChange >= 0 ? "▲" : "▼";

  const tags = [];
  if (stock.archived) tags.push(`<span class="mini-tag archived" title="${stock.archived_reason || ""}">Archived</span>`);
  if (stock.reversal_score >= 2) tags.push(`<span class="mini-tag jackpot" title="${stock.reversal_score} of ${stock.reversal_total} reversal signals confirming">★ ${stock.reversal_score}/${stock.reversal_total} Reversal</span>`);
  if (stock.consolidating) tags.push(`<span class="mini-tag squeeze">◆ Squeeze</span>`);
  if (stock.adp5_trend === "Rising") tags.push(`<span class="mini-tag adp-rising" title="5-day avg delivery % vs previous day">▲ 5D ADP</span>`);
  if (stock.adp5_trend === "Falling") tags.push(`<span class="mini-tag adp-falling" title="5-day avg delivery % vs previous day">▼ 5D ADP</span>`);
  if (stock.adp20_trend === "Rising") tags.push(`<span class="mini-tag adp-rising" title="20-day avg delivery % vs previous day">▲ 20D ADP</span>`);
  if (stock.adp20_trend === "Falling") tags.push(`<span class="mini-tag adp-falling" title="20-day avg delivery % vs previous day">▼ 20D ADP</span>`);
  if (stock.buying_selling_verdict === "Heavy Buying") tags.push(`<span class="mini-tag dv-buying" title="Delivery % exceeded 1.3x its 20-day baseline on more up-days than down-days, last 30 sessions">Heavy Buying</span>`);
  if (stock.buying_selling_verdict === "Heavy Selling") tags.push(`<span class="mini-tag dv-selling" title="Delivery % exceeded 1.3x its 20-day baseline on more down-days than up-days, last 30 sessions">Heavy Selling</span>`);
  if (stock.adp_cross_state === "Bullish") {
    const age = stock.adp_crossover_age;
    const ageStr = age !== null && age !== undefined ? ` (${age}d)` : "";
    tags.push(`<span class="mini-tag cross-bull" title="5-day avg delivery % is currently above the 20-day avg">5D↗20D ADP${ageStr}</span>`);
  }
  if (stock.adp_cross_state === "Bearish") {
    const age = stock.adp_crossover_age;
    const ageStr = age !== null && age !== undefined ? ` (${age}d)` : "";
    tags.push(`<span class="mini-tag cross-bear" title="5-day avg delivery % is currently below the 20-day avg">5D↘20D ADP${ageStr}</span>`);
  }
  if (stock.harmonic_pattern) {
    const hc = stock.harmonic_pattern.toLowerCase().includes("bullish") ? "harmonic-bull" : "harmonic-bear";
    tags.push(`<span class="mini-tag ${hc}" title="${stock.harmonic_status} · D: ₹${stock.harmonic_d_price} · Confidence ${stock.harmonic_confidence}%">${stock.harmonic_pattern}</span>`);
  }
  if (stock.wm_pattern) {
    tags.push(`<span class="mini-tag wm" title="Neckline ₹${stock.wm_breakout_level} · ${stock.wm_distance_pct}% away · ${stock.wm_status}">"${stock.wm_pattern}" · ${stock.wm_status}</span>`);
  }
  if (stock.rsi_daily_divergence) {
    const rc = stock.rsi_daily_divergence.toLowerCase() === "bullish" ? "rsi-bull" : "rsi-bear";
    tags.push(`<span class="mini-tag ${rc}" title="Latest daily RSI divergence">RSI D: ${stock.rsi_daily_divergence} · ${stock.rsi_daily_days_ago}d</span>`);
  }
  if (stock.rsi_weekly_divergence) {
    const rc = stock.rsi_weekly_divergence.toLowerCase() === "bullish" ? "rsi-bull" : "rsi-bear";
    tags.push(`<span class="mini-tag ${rc}" title="Latest weekly RSI divergence">RSI W: ${stock.rsi_weekly_divergence} · ${stock.rsi_weekly_days_ago}d</span>`);
  }
  (stock.source || "").split(",").filter(Boolean).forEach((s) => {
    tags.push(`<span class="mini-tag">${s}</span>`);
  });

  return `
    <tr class="stock-row ${cls}${stock.archived ? " archived" : ""}" data-category="${cls}">
      <td class="cell-symbol">
        <div class="symbol-line">
          <span class="symbol">${stock.symbol}</span>
          ${decisionBadge(stock)}
          <a href="https://www.tradingview.com/chart/?symbol=NSE:${stock.symbol}" target="_blank" rel="noopener" class="tv-link">TV ↗</a>
          <button class="notes-toggle${(stock.comments || []).length ? " has-notes" : ""}" data-symbol="${stock.symbol}" title="Notes for ${stock.symbol}">📝 ${(stock.comments || []).length}</button>
        </div>
        <div class="name">${stock.name || ""}</div>
        <div class="tag-row">${tags.join("")}</div>
      </td>
      <td><span class="bs-pill ${bs}">${bs === "buy" ? "▲ B" : "▼ S"}</span></td>
      <td class="mono-cell">
        <div class="value-edit">
          <input type="number" step="0.01" class="value-input" value="${stock.buy_target || ""}" placeholder="entry" data-symbol="${stock.symbol}" data-field="target" />
          <button class="save-btn" data-symbol="${stock.symbol}" data-field="target">Save</button>
        </div>
      </td>
      <td class="mono-cell">
        <div class="price-cell">
          <span class="price">₹${Number(stock.price).toFixed(2)}</span>
          <span class="day-change" style="color:${dayChangeColor};"><span class="trend-arrow">${trendArrow}</span>${dayChange >= 0 ? "+" : ""}${dayChange}%</span>
        </div>
      </td>
      <td class="mono-cell">${(stock.source || "").split(",").filter(Boolean).join(", ") || "-"}</td>
      <td class="mono-cell">
        <div class="value-edit">
          <input type="number" step="0.01" class="value-input sl-input" value="${stock.stop_loss || ""}" placeholder="SL" data-symbol="${stock.symbol}" data-field="stop_loss" />
          <button class="save-btn sl-save" data-symbol="${stock.symbol}" data-field="stop_loss">Save</button>
        </div>
      </td>
    </tr>
    ${expandedNotes.has(stock.symbol) ? renderNotesRow(stock) : ""}
  `;
}

function computeFilteredStocks() {
  const showExtreme = quickFilters.above20 || quickFilters.below20;
  const isExtreme = (s) => s.archived || (s.distance_pct !== undefined && Math.abs(s.distance_pct) > 20);
  let filtered = showExtreme ? latestStocks.slice() : latestStocks.filter((s) => !isExtreme(s));

  if (buysellFilter !== "all") {
    filtered = filtered.filter((s) => buySell(s) === buysellFilter);
  }

  if (decisionFilter !== "all") {
    filtered = filtered.filter((s) => decision(s) === decisionFilter);
  }

  if (sourceFilter !== "all") {
    filtered = filtered.filter((s) => (s.source || "").split(",").includes(sourceFilter));
  }

  if (crossAgeFilter !== "all") {
    const minAge = parseInt(crossAgeFilter, 10);
    filtered = filtered.filter((s) => s.adp_crossover_age !== null && s.adp_crossover_age !== undefined && Number(s.adp_crossover_age) >= minAge);
  }

  if (quickFilters.neartarget) filtered = filtered.filter((s) => classify(s) === "watch");
  if (quickFilters.needtarget) filtered = filtered.filter((s) => classify(s) === "needtarget");
  if (quickFilters.confirmedBuy) filtered = filtered.filter((s) => s.dv_decision === "Confirmed Buy");
  if (quickFilters.squeeze) filtered = filtered.filter((s) => !!s.consolidating);
  if (quickFilters.rsiDBull) filtered = filtered.filter((s) => (s.rsi_daily_divergence || "").toLowerCase() === "bullish");
  if (quickFilters.rsiDBear) filtered = filtered.filter((s) => (s.rsi_daily_divergence || "").toLowerCase() === "bearish");
  if (quickFilters.rsiWBull) filtered = filtered.filter((s) => (s.rsi_weekly_divergence || "").toLowerCase() === "bullish");
  if (quickFilters.rsiWBear) filtered = filtered.filter((s) => (s.rsi_weekly_divergence || "").toLowerCase() === "bearish");
  if (quickFilters.above20) filtered = filtered.filter((s) => s.distance_pct !== undefined && s.distance_pct > 20);
  if (quickFilters.below20) filtered = filtered.filter((s) => s.distance_pct !== undefined && s.distance_pct < -20);
  if (quickFilters.jackpot) filtered = filtered.filter((s) => s.reversal_score >= 3);

  if (currentSearch.trim() !== "") {
    const q = currentSearch.trim().toLowerCase();
    filtered = filtered.filter((s) =>
      (s.symbol || "").toLowerCase().includes(q) || (s.name || "").toLowerCase().includes(q)
    );
  }

  if (cmpSortDir) {
    filtered.sort((a, b) => cmpSortDir === "asc" ? a.price - b.price : b.price - a.price);
  }

  return filtered;
}

function render() {
  const container = document.getElementById("rows");
  const filtered = computeFilteredStocks();

  renderTickerBand(filtered);

  if (filtered.length === 0) {
    container.innerHTML = '<tr><td colspan="6" class="empty">Nothing matches this filter right now.</td></tr>';
  } else {
    container.innerHTML = filtered.map(renderRow).join("");
  }

  renderNewsList(); // keep the news panel in sync with whatever the table is currently showing
}

function renderTickerBand(filtered) {
  const list = document.getElementById("ticker-list");
  if (filtered.length === 0) {
    list.innerHTML = '<span class="ticker-empty">No symbols match the current filter.</span>';
    return;
  }
  list.innerHTML = filtered.map((s) => {
    const change = s.percent_change || 0;
    const dir = change >= 0 ? "up" : "down";
    const arrow = change >= 0 ? "▲" : "▼";
    return `<span class="ticker-chip ${dir}">${arrow} ${s.symbol}</span>`;
  }).join("");
}

function updateStats() {
  document.getElementById("stat-total").textContent = latestStocks.length;
  document.getElementById("stat-buyzone").textContent = latestStocks.filter((s) => classify(s) === "buyzone").length;
  document.getElementById("stat-neartarget").textContent = latestStocks.filter((s) => classify(s) === "watch").length;
  document.getElementById("stat-needtarget").textContent = latestStocks.filter((s) => classify(s) === "needtarget").length;
}

async function loadDashboard() {
  try {
    const res = await fetch("/api/dashboard?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();

    if (data.error) {
      document.getElementById("rows").innerHTML = `<tr><td colspan="6" class="empty">Error loading data: ${data.error}</td></tr>`;
      return;
    }

    latestStocks = data.stocks || [];
    updateStats();
    render();

    const syncedDate = new Date(data.syncedAt);
    document.getElementById("synced-at").textContent = "Last loaded " + syncedDate.toLocaleTimeString();
  } catch (e) {
    document.getElementById("rows").innerHTML = `<tr><td colspan="6" class="empty">Could not reach the dashboard API.</td></tr>`;
  }
}

document.getElementById("rows").addEventListener("click", async (e) => {
  if (e.target.classList.contains("notes-toggle")) {
    const symbol = e.target.dataset.symbol;
    if (expandedNotes.has(symbol)) {
      expandedNotes.delete(symbol);
    } else {
      expandedNotes.add(symbol);
    }
    render();
    return;
  }

  if (e.target.classList.contains("notes-save-btn")) {
    const btn = e.target;
    const symbol = btn.dataset.symbol;
    const textarea = document.querySelector(`.notes-input[data-symbol="${symbol}"]`);
    const comment = textarea.value.trim();

    if (!comment) {
      textarea.style.borderColor = "var(--accent-loss)";
      return;
    }

    btn.classList.add("saving");
    btn.textContent = "…";

    try {
      const res = await fetch("/api/add-comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol, comment }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || "Failed to save note");
      }

      expandedNotes.add(symbol); // keep the panel open after saving
      await loadDashboard();
    } catch (err) {
      btn.classList.remove("saving");
      btn.textContent = "Save Note";
      alert("Could not save note: " + err.message);
    }
    return;
  }

  if (e.target.classList.contains("save-btn")) {
    const btn = e.target;
    const symbol = btn.dataset.symbol;
    const field = btn.dataset.field;
    const input = document.querySelector(`.value-input[data-symbol="${symbol}"][data-field="${field}"]`);
    const value = parseFloat(input.value);

    if (!value || value <= 0) {
      input.style.borderColor = "var(--accent-loss)";
      return;
    }

    const endpoint = field === "stop_loss" ? "/api/set-stoploss" : "/api/set-target";
    const payload = field === "stop_loss" ? { symbol, stop_loss: value } : { symbol, target: value };
    const label = field === "stop_loss" ? "stop loss" : "target";

    btn.classList.add("saving");
    btn.textContent = "…";

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || "Failed to save");
      }

      await loadDashboard();
    } catch (err) {
      btn.classList.remove("saving");
      btn.textContent = "Retry";
      alert(`Could not save ${label}: ` + err.message);
    }
    return;
  }
});

document.getElementById("stock-search").addEventListener("input", (e) => {
  currentSearch = e.target.value;
  render();
});

document.querySelectorAll(".chip-check input[data-quick]").forEach((cb) => {
  cb.addEventListener("change", () => {
    quickFilters[cb.dataset.quick] = cb.checked;
    cb.closest(".chip-check").classList.toggle("on", cb.checked);
    render();
  });
});

document.getElementById("sel-buysell").addEventListener("change", (e) => {
  buysellFilter = e.target.value;
  render();
});

document.getElementById("sel-decision").addEventListener("change", (e) => {
  decisionFilter = e.target.value;
  render();
});

document.getElementById("sel-source").addEventListener("change", (e) => {
  sourceFilter = e.target.value;
  render();
});

document.getElementById("sel-crossage").addEventListener("change", (e) => {
  crossAgeFilter = e.target.value;
  render();
});

document.getElementById("th-cmp").addEventListener("click", () => {
  cmpSortDir = cmpSortDir === "asc" ? "desc" : cmpSortDir === "desc" ? null : "asc";
  render();
});

document.getElementById("reset-filters").addEventListener("click", () => {
  currentSearch = "";
  document.getElementById("stock-search").value = "";
  quickFilters = { neartarget: false, needtarget: false, confirmedBuy: false, squeeze: false, rsiDBull: false, rsiDBear: false, rsiWBull: false, rsiWBear: false, above20: false, below20: false, jackpot: false };
  document.querySelectorAll(".chip-check input[data-quick]").forEach((cb) => {
    cb.checked = false;
    cb.closest(".chip-check").classList.remove("on");
  });
  buysellFilter = "all"; document.getElementById("sel-buysell").value = "all";
  decisionFilter = "all"; document.getElementById("sel-decision").value = "all";
  sourceFilter = "all"; document.getElementById("sel-source").value = "all";
  crossAgeFilter = "all"; document.getElementById("sel-crossage").value = "all";
  cmpSortDir = null;
  render();
});

let newsSentimentFilter = "all";
let newsSearchQuery = "";
let latestNews = [];

function flagClass(sentiment) {
  if (sentiment === "Good") return "good";
  if (sentiment === "Bad") return "bad";
  return "neutral";
}

function renderNewsItem(item) {
  return `
    <div class="news-item" data-id="${item.id}">
      <span class="news-flag ${flagClass(item.sentiment)}">${item.sentiment}</span>
      <div class="news-body">
        <div class="news-top-row">
          <span class="news-symbol">${item.symbol}</span>
          <span class="news-date">${item.date}${item.source ? " · " + item.source : ""}</span>
        </div>
        <div class="news-headline"><a href="${item.link}" target="_blank" rel="noopener">${item.headline}</a></div>
        ${item.reason ? `<div class="news-reason">${item.reason}</div>` : ""}
      </div>
      <button class="news-dismiss" data-id="${item.id}" title="Dismiss">✕</button>
    </div>
  `;
}

function renderNewsList() {
  const container = document.getElementById("news-list");
  let base;

  const q = newsSearchQuery.trim().toLowerCase();
  if (q !== "") {
    // Explicit search overrides the table-filter restriction -- look up any stock's news.
    base = latestNews.filter((item) =>
      (item.symbol || "").toLowerCase().includes(q) || (item.headline || "").toLowerCase().includes(q)
    );
  } else {
    // Default: only news for stocks currently visible in the table above.
    const visibleSymbols = new Set(computeFilteredStocks().map((s) => s.symbol));
    base = latestNews.filter((item) => visibleSymbols.has(item.symbol));
  }

  const filtered = newsSentimentFilter === "all"
    ? base
    : base.filter((item) => item.sentiment === newsSentimentFilter);

  if (filtered.length === 0) {
    if (latestNews.length === 0) {
      container.innerHTML = '<div class="news-empty">No news yet.</div>';
    } else if (q !== "") {
      container.innerHTML = '<div class="news-empty">No news found for that search.</div>';
    } else {
      container.innerHTML = '<div class="news-empty">No news for the currently filtered stocks.</div>';
    }
    return;
  }

  container.innerHTML = filtered.map(renderNewsItem).join("");
}

async function loadNews() {
  const container = document.getElementById("news-list");
  try {
    const res = await fetch("/api/news?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();
    latestNews = data.news || [];
    renderNewsList();
  } catch (e) {
    container.innerHTML = '<div class="news-empty">Could not reach the news API.</div>';
  }
}

document.getElementById("news-search").addEventListener("input", (e) => {
  newsSearchQuery = e.target.value;
  renderNewsList();
});

document.getElementById("news-filter-row").addEventListener("click", (e) => {
  if (!e.target.classList.contains("news-filter-chip")) return;
  newsSentimentFilter = e.target.dataset.filter;
  document.querySelectorAll(".news-filter-chip").forEach((chip) => {
    chip.classList.toggle("on", chip.dataset.filter === newsSentimentFilter);
  });
  renderNewsList();
});

document.addEventListener("click", async (e) => {
  if (!e.target.classList.contains("news-dismiss")) return;

  const btn = e.target;
  const id = btn.dataset.id;
  btn.disabled = true;

  try {
    const res = await fetch("/api/news", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "Failed to dismiss");

    btn.closest(".news-item").remove();
    latestNews = latestNews.filter((item) => item.id !== id);
    const container = document.getElementById("news-list");
    if (!container.querySelector(".news-item")) {
      renderNewsList();
    }
  } catch (err) {
    btn.disabled = false;
    alert("Could not dismiss: " + err.message);
  }
});

loadDashboard();
loadNews();
setInterval(() => { loadDashboard(); loadNews(); }, 5 * 60 * 1000);
</script>
</body>
</html>

name: Fetch OHLC Candles

on:
  schedule:
    # Runs at 4:00 PM IST (10:30 UTC), after market close, Mon-Fri
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  fetch-ohlc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance google-api-python-client google-auth

      - name: Run OHLC fetch script
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/fetch_ohlc.py

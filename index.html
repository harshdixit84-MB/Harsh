<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monthly Breakout Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2b2d31;
    --surface-1: #33353a;
    --surface-2: #3a3d42;
    --border: #45484d;
    --text-primary: #edeff2;
    --text-secondary: #8a8f9c;
    --accent-buy: #198754;
    --accent-buy-dim: rgba(25, 135, 84, 0.16);
    --accent-watch: #ffc107;
    --accent-watch-dim: rgba(255, 193, 7, 0.14);
    --accent-tracking: #0d6efd;
    --accent-tracking-dim: rgba(13, 110, 253, 0.14);
    --accent-needtarget: #0dcaf0;
    --accent-loss: #ab2e3c;
    --accent-magenta: #af1763;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "IBM Plex Mono", monospace;
    min-height: 100vh;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .title {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  .stats {
    display: flex;
    gap: 24px;
  }

  .stat {
    text-align: right;
  }

  .stat .num {
    font-family: "Space Grotesk", sans-serif;
    font-size: 20px;
    font-weight: 600;
  }

  .stat .label {
    color: var(--text-secondary);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .filter-btn {
    background: var(--surface-1);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn:hover { border-color: var(--text-secondary); }
  .filter-btn.active {
    background: var(--surface-2);
    color: var(--text-primary);
    border-color: var(--text-primary);
  }

  .rows { display: flex; flex-direction: column; gap: 6px; }

  .row {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--surface-1);
    border-radius: 10px;
    overflow: hidden;
  }

  .row-accent {
    width: 4px;
    align-self: stretch;
    flex-shrink: 0;
  }
  .row-accent.buyzone { background: var(--accent-buy); }
  .row-accent.watch { background: var(--accent-watch); }
  .row-accent.tracking { background: var(--accent-tracking); }
  .row-accent.needtarget { background: var(--accent-needtarget); }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
    font-family: "Space Grotesk", sans-serif;
    margin: 12px;
    flex-shrink: 0;
  }
  .avatar.buyzone { background: rgba(25,135,84,0.18); color: #3ddc8a; }
  .avatar.watch { background: rgba(255,193,7,0.18); color: #ffcf3d; }
  .avatar.tracking { background: rgba(13,110,253,0.18); color: #6ea8fe; }
  .avatar.needtarget { background: rgba(13,202,240,0.18); color: #5fd8ec; }

  .row-main {
    flex: 1;
    padding: 12px 8px 12px 0;
    min-width: 0;
  }

  .row-side {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 16px;
    flex-wrap: nowrap;
  }

  .trend-arrow { font-size: 10px; margin-right: 3px; }

  .symbol {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.01em;
  }

  .name {
    color: var(--text-secondary);
    font-size: 11px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .prices {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .price { color: var(--text-primary); font-size: 14px; font-weight: 600; }

  .target-edit {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .target-input {
    width: 72px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 4px;
  }
  .target-input:focus { outline: none; border-color: var(--accent-buy); }

  .save-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .save-btn:hover { color: var(--accent-buy); border-color: var(--accent-buy); }
  .save-btn.saving { opacity: 0.5; pointer-events: none; }

  .gauge-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .gauge-track {
    position: relative;
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }

  .gauge-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    border-radius: 3px;
  }

  .gauge-label {
    font-size: 11px;
    text-align: center;
  }

  .day-change {
    text-align: right;
    font-size: 12px;
  }

  .badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    text-align: center;
    white-space: nowrap;
  }

  .badge.buy { background: rgba(25,135,84,0.18); color: #3ddc8a; }
  .badge.watch { background: rgba(255,193,7,0.18); color: #ffcf3d; }
  .badge.tracking { background: rgba(13,110,253,0.18); color: #6ea8fe; }
  .badge.needs-target { background: rgba(13,202,240,0.14); color: #5fd8ec; border: 1px dashed rgba(13,202,240,0.4); }

  .signal-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 4px;
    display: inline-block;
  }
  .signal-badge.strong { background: rgba(13,110,253,0.18); color: #6ea8fe; }
  .signal-badge.moderate { background: rgba(13,202,240,0.18); color: #5fd8ec; }
  .signal-badge.weak { background: var(--surface-2); color: var(--text-secondary); }
  .squeeze-tag {
    font-size: 10px;
    color: #f28ab4;
    background: rgba(175,23,99,0.2);
    padding: 2px 7px;
    border-radius: 4px;
    display: inline-block;
  }

  .high-dv-tag {
    font-size: 10px;
    color: #0dcaf0;
    background: rgba(13,202,240,0.16);
    padding: 2px 7px;
    border-radius: 4px;
    display: inline-block;
  }

  .source-tag {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 3px;
    display: inline-block;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .source-tag.breakout { color: #6ea8fe; border-color: rgba(110,168,254,0.4); }
  .source-tag.consolidation { color: #ffcf3d; border-color: rgba(255,207,61,0.4); }

  .verdict-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 4px;
    display: inline-block;
    font-weight: 600;
  }
  .verdict-tag.buying { background: rgba(25,135,84,0.2); color: #3ddc8a; }
  .verdict-tag.selling { background: rgba(171,46,60,0.2); color: #e5626b; }

  .fno-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .fno-toggle input { accent-color: var(--accent-tracking); cursor: pointer; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-box {
    background: var(--surface-1);
    border-radius: 12px;
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-title { font-family: "Space Grotesk", sans-serif; font-size: 18px; font-weight: 600; }
  .modal-close {
    background: var(--surface-2);
    border: none;
    color: var(--text-secondary);
    width: 28px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }
  .bias-banner {
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-weight: 600;
    font-size: 15px;
  }
  .bias-banner.bullish { background: rgba(25,135,84,0.18); color: #3ddc8a; }
  .bias-banner.bearish { background: rgba(171,46,60,0.18); color: #e5626b; }
  .bias-banner.neutral { background: var(--surface-2); color: var(--text-secondary); }
  .oc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .oc-card {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 12px;
  }
  .oc-card .oc-label { font-size: 10px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
  .oc-card .oc-value { font-size: 14px; font-weight: 600; }
  .oc-list-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .oc-list-row:last-child { border-bottom: none; }
  .narrative-item { font-size: 12px; padding: 6px 0; color: var(--text-primary); border-bottom: 1px solid var(--border); }
  .narrative-item:last-child { border-bottom: none; }
  .verdict-box {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-top: 12px;
    border-left: 3px solid var(--accent-magenta);
  }

  .empty, .loading {
    color: var(--text-secondary);
    text-align: center;
    padding: 60px 0;
    font-size: 13px;
  }

  footer {
    color: var(--text-secondary);
    font-size: 11px;
    text-align: center;
    margin-top: 32px;
  }

  @media (max-width: 640px) {
    .row { flex-wrap: wrap; }
    .row-side { flex-wrap: wrap; gap: 10px; padding: 0 16px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="title">Monthly Breakout Scan</div>
      <div class="subtitle" id="synced-at">Loading last sync time…</div>
      <a href="/pl.html" style="color:var(--text-secondary); font-size:11px; text-decoration:none; border:1px solid var(--border); padding:4px 10px; border-radius:5px; display:inline-block; margin-top:8px;">P/L Tracker →</a>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="num" id="stat-total">–</div>
        <div class="label">Tracked</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-buyzone">–</div>
        <div class="label">Buy zone</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-neartarget">–</div>
        <div class="label">Near target</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-needtarget">–</div>
        <div class="label">Need target</div>
      </div>
    </div>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="buyzone">Buy zone</button>
    <button class="filter-btn" data-filter="watch">Near target</button>
    <button class="filter-btn" data-filter="needtarget">Needs target</button>
    <button class="filter-btn active" data-source-filter="all">All sources</button>
    <button class="filter-btn" data-source-filter="Breakout">Breakout</button>
    <button class="filter-btn" data-source-filter="Consolidation">Consolidation</button>
  </div>

  <div class="rows" id="rows">
    <div class="loading">Fetching dashboard…</div>
  </div>

  <footer>Auto-refreshes every 5 minutes · data synced from Chartlink via scheduled job</footer>
</div>

<div id="oc-modal-container"></div>

<script>
  const WATCH_THRESHOLD = 2; // within this % counts as "watch"
  let currentFilter = "all";
  let currentSourceFilter = "all";
  let latestStocks = [];
  let fnoSymbols = new Set();

  async function loadFnoList() {
    try {
      const res = await fetch("/api/fno-list?t=" + Date.now(), { cache: "no-store" });
      const data = await res.json();
      fnoSymbols = new Set(data.symbols || []);
      render();
    } catch (e) {
      // If this fails, radio buttons simply won't show -- not fatal to the dashboard
    }
  }

  function classify(stock) {
    if (stock.distance_pct === undefined) return "needtarget";
    const d = Math.abs(stock.distance_pct);
    if (stock.distance_pct <= 0) return "buyzone";
    if (d <= WATCH_THRESHOLD) return "watch";
    return "tracking";
  }

  function renderRow(stock) {
    const cls = classify(stock);

    let gaugeHtml = "";
    let distanceLabel = "no target set";

    if (stock.distance_pct !== undefined) {
      const clamped = Math.max(-20, Math.min(20, stock.distance_pct));
      const widthPct = (Math.abs(clamped) / 20) * 50;
      const fillColor = stock.distance_pct <= 0 ? "var(--accent-buy)" : cls === "watch" ? "var(--accent-watch)" : "var(--text-secondary)";
      const leftPos = stock.distance_pct <= 0 ? `calc(50% - ${widthPct}%)` : "50%";
      gaugeHtml = `<div class="gauge-track"><div class="gauge-fill" style="left:${leftPos}; width:${widthPct}%; background:${fillColor};"></div></div>`;
      distanceLabel = `${stock.distance_pct > 0 ? "+" : ""}${stock.distance_pct}%`;
    } else {
      gaugeHtml = `<div class="gauge-track"></div>`;
    }

    const badgeMap = {
      buyzone: '<span class="badge buy">Buy zone</span>',
      watch: '<span class="badge watch">Watch</span>',
      tracking: '<span class="badge tracking">Tracking</span>',
      needtarget: '<span class="badge needs-target">Needs target</span>',
    };

    const dayChange = stock.percent_change || 0;
    const dayChangeColor = dayChange >= 0 ? "var(--accent-buy)" : "var(--accent-loss)";
    const trendArrow = dayChange >= 0 ? "▲" : "▼";
    const initial = (stock.symbol || "?").charAt(0);

    return `
      <div class="row" data-category="${cls}">
        <div class="row-accent ${cls}"></div>
        <div class="avatar ${cls}">${initial}</div>
        <div class="row-main">
          <div class="symbol">${stock.symbol}</div>
          <div class="name">${stock.name || ""}</div>
          <div style="display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;">
            ${stock.signal_label ? `<span class="signal-badge ${stock.signal_label.toLowerCase()}">${stock.signal_label} signal</span>` : ""}
            ${stock.consolidating ? `<span class="squeeze-tag">◆ Squeeze</span>` : ""}
            ${stock.high_dv ? `<span class="high-dv-tag">⬤ High DV</span>` : ""}
            ${stock.buying_selling_verdict === "Heavy Buying" ? `<span class="verdict-tag buying">Heavy Buying</span>` : ""}
            ${stock.buying_selling_verdict === "Heavy Selling" ? `<span class="verdict-tag selling">Heavy Selling</span>` : ""}
            ${(stock.source || "").split(",").filter(Boolean).map((s) => `<span class="source-tag ${s.toLowerCase()}">${s}</span>`).join("")}
            ${fnoSymbols.has(stock.symbol) ? `<label class="fno-toggle"><input type="radio" name="fno-select" class="fno-radio" data-symbol="${stock.symbol}"><span>Options view</span></label>` : ""}
          </div>
        </div>
        <div class="row-side">
          <div class="target-edit">
            <input
              type="number"
              step="0.01"
              class="target-input"
              value="${stock.buy_target || ""}"
              placeholder="target"
              data-symbol="${stock.symbol}"
            />
            <button class="save-btn" data-symbol="${stock.symbol}">Save</button>
          </div>
          <div class="gauge-wrap">
            ${gaugeHtml}
            <div class="gauge-label" style="color:${stock.distance_pct !== undefined ? (stock.distance_pct <= 0 ? 'var(--accent-buy)' : 'var(--text-secondary)') : 'var(--text-secondary)'}">${distanceLabel}</div>
          </div>
          <div style="text-align:right;">
            <div class="price">₹${Number(stock.price).toFixed(2)}</div>
            <div class="day-change" style="color:${dayChangeColor};"><span class="trend-arrow">${trendArrow}</span>${dayChange >= 0 ? "+" : ""}${dayChange}%</div>
          </div>
        </div>
      </div>
    `;
  }

  function render() {
    const container = document.getElementById("rows");
    let filtered = currentFilter === "all"
      ? latestStocks
      : latestStocks.filter((s) => classify(s) === currentFilter);

    if (currentSourceFilter !== "all") {
      filtered = filtered.filter((s) => (s.source || "").split(",").includes(currentSourceFilter));
    }

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty">Nothing matches this filter right now.</div>';
      return;
    }

    container.innerHTML = filtered.map(renderRow).join("");
  }

  function updateStats() {
    document.getElementById("stat-total").textContent = latestStocks.length;
    document.getElementById("stat-buyzone").textContent = latestStocks.filter((s) => classify(s) === "buyzone").length;
    document.getElementById("stat-neartarget").textContent = latestStocks.filter((s) => classify(s) === "watch").length;
    document.getElementById("stat-needtarget").textContent = latestStocks.filter((s) => classify(s) === "needtarget").length;
  }

  async function loadDashboard() {
    try {
      const res = await fetch("/api/dashboard?t=" + Date.now(), { cache: "no-store" });
      const data = await res.json();

      if (data.error) {
        document.getElementById("rows").innerHTML = `<div class="empty">Error loading data: ${data.error}</div>`;
        return;
      }

      latestStocks = data.stocks || [];
      updateStats();
      render();

      const syncedDate = new Date(data.syncedAt);
      document.getElementById("synced-at").textContent = "Last loaded " + syncedDate.toLocaleTimeString();
    } catch (e) {
      document.getElementById("rows").innerHTML = `<div class="empty">Could not reach the dashboard API.</div>`;
    }
  }

  document.getElementById("rows").addEventListener("click", async (e) => {
    if (!e.target.classList.contains("save-btn")) return;

    const btn = e.target;
    const symbol = btn.dataset.symbol;
    const input = document.querySelector(`.target-input[data-symbol="${symbol}"]`);
    const value = parseFloat(input.value);

    if (!value || value <= 0) {
      input.style.borderColor = "var(--accent-loss)";
      return;
    }

    btn.classList.add("saving");
    btn.textContent = "…";

    try {
      const res = await fetch("/api/set-target", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol, target: value }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || "Failed to save");
      }

      await loadDashboard();
    } catch (err) {
      btn.classList.remove("saving");
      btn.textContent = "Retry";
      alert("Could not save target: " + err.message);
    }
  });

  document.querySelectorAll(".filter-btn[data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn[data-filter]").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  document.querySelectorAll(".filter-btn[data-source-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn[data-source-filter]").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentSourceFilter = btn.dataset.sourceFilter;
      render();
    });
  });

  document.getElementById("rows").addEventListener("click", async (e) => {
    if (e.target.classList.contains("fno-radio")) {
      const symbol = e.target.dataset.symbol;
      showOptionChainModal(symbol);
    }
  });

  function biasClass(bias) {
    if (bias === "Bullish") return "bullish";
    if (bias === "Bearish") return "bearish";
    return "neutral";
  }

  function renderOcRow(item) {
    const changeText = item.change_oi === null
      ? "no history yet"
      : `${item.change_oi >= 0 ? "+" : ""}${item.change_oi.toLocaleString()}`;
    const changeColor = item.change_oi === null ? "var(--text-secondary)" : (item.change_oi >= 0 ? "var(--accent-buy)" : "var(--accent-loss)");
    return `<div class="oc-list-row"><span>₹${item.strike}</span><span>OI: ${item.oi.toLocaleString()}</span><span style="color:${changeColor}">${changeText}</span></div>`;
  }

  async function showOptionChainModal(symbol) {
    const container = document.getElementById("oc-modal-container");
    container.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box">
          <div class="modal-header">
            <div class="modal-title">${symbol} — Option Chain</div>
            <button class="modal-close" id="oc-close-btn">✕</button>
          </div>
          <div style="color:var(--text-secondary); font-size:13px;">Fetching live option chain data…</div>
        </div>
      </div>
    `;
    document.getElementById("oc-close-btn").addEventListener("click", closeOptionChainModal);

    try {
      const res = await fetch(`/api/option-chain?symbol=${symbol}&t=${Date.now()}`, { cache: "no-store" });
      const data = await res.json();

      if (data.error) {
        container.querySelector(".modal-box").innerHTML += `<div style="color:var(--accent-loss); font-size:13px; margin-top:10px;">Error: ${data.error}</div>`;
        return;
      }

      const cls = biasClass(data.bias);

      container.querySelector(".modal-box").innerHTML = `
        <div class="modal-header">
          <div class="modal-title">${data.symbol} — Option Chain (${data.expiry})</div>
          <button class="modal-close" id="oc-close-btn">✕</button>
        </div>

        <div class="bias-banner ${cls}">Market Bias: ${data.bias} &nbsp;·&nbsp; Confidence: ${data.confidence}%</div>

        <div class="oc-grid">
          <div class="oc-card"><div class="oc-label">Spot Price</div><div class="oc-value">${data.spot_price ? "₹" + data.spot_price : "—"}</div></div>
          <div class="oc-card"><div class="oc-label">PCR</div><div class="oc-value">${data.pcr ?? "—"}</div></div>
          <div class="oc-card"><div class="oc-label">Max Pain</div><div class="oc-value">${data.max_pain ?? "—"}</div></div>
          <div class="oc-card"><div class="oc-label">Expected Range</div><div class="oc-value">${data.expected_range.low ?? "—"} – ${data.expected_range.high ?? "—"}</div></div>
        </div>

        <div class="oc-grid">
          <div>
            <div class="oc-label" style="margin-bottom:6px; color:var(--accent-buy);">Support (Put OI)</div>
            ${data.support.map(renderOcRow).join("")}
          </div>
          <div>
            <div class="oc-label" style="margin-bottom:6px; color:var(--accent-loss);">Resistance (Call OI)</div>
            ${data.resistance.map(renderOcRow).join("")}
          </div>
        </div>

        <div class="oc-label" style="margin-bottom:6px;">Institutional Positioning</div>
        ${data.narrative.map((n) => `<div class="narrative-item">${n}</div>`).join("")}

        <div class="verdict-box">${data.verdict}</div>
      `;
      document.getElementById("oc-close-btn").addEventListener("click", closeOptionChainModal);
    } catch (err) {
      container.querySelector(".modal-box").innerHTML += `<div style="color:var(--accent-loss); font-size:13px; margin-top:10px;">Could not reach the option chain API.</div>`;
    }
  }

  function closeOptionChainModal() {
    document.getElementById("oc-modal-container").innerHTML = "";
    document.querySelectorAll(".fno-radio").forEach((r) => (r.checked = false));
  }

  loadDashboard();
  loadFnoList();
  setInterval(loadDashboard, 5 * 60 * 1000);
</script>
</body>
</html>
